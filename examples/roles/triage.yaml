name: triage
# The TUI home screen loads this flight on open.
home: triage
# While the triage role is active, only these show up in lists and the TUI.
flights: [triage]
queries: [incidents, loki-errors, datasource-a-health, my-open-prs, gcx-status]
filters: [no-bots]
# Per-tool context bindings applied on role activation (ADR-9).
contexts:
  kubectl: prod
  gcx: myorg.grafana.net
