name: ops
# Home flight for plugin/context smoke + reminders.
home: plugins
flights: [plugins, ntr, triage]
queries:
  - gcx-status
  - kubectl-context
  - gooseai-context
  - pi-context
  - opencode-context
  - ollama-context
  - ntr-list
  - incidents
# Applied on role activation.
contexts:
  kubectl: prod
  gcx: myorg.grafana.net
  gooseai: default
  pi: default
  opencode: default
  ollama: local
