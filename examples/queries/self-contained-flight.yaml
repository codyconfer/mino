# `type:` picks the kind, so a flight can live in `queries/` beside the queries
# it composes. The directory means nothing; without the `type: flight` line this
# document would be rejected for not declaring a kind at all.
name: escalations
type: flight
queries: [escalations-open, escalations-mine]
---
name: escalations-open
type: query
signal: github
params:
  query: "is:open label:incident sort:created-desc"
---
name: escalations-mine
type: query
signal: github
params:
  query: "is:open label:incident assignee:@me"
