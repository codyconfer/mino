# Opt-in demo query — live GitHub search; each item carries a github.com html_url.
# Pair with flight/role `demo` (`munin fly demo` / `munin --role demo query demo`).
# Synthetic notify toasts live in flight `notify-smoke` (`signal: demo`).
name: demo
signal: github
filters: [demo]
params:
  query: "is:open is:pr author:@me"
