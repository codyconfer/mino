# Copy to ~/.mino/config.yaml and edit. Every field is optional; the values
# shown are mino's built-in defaults (except roles/flights, empty by default).

output: terminal            # terminal | json  (override per-run with --output)
timeout: 30s                # per-signal fetch timeout (override with --timeout)
# The UI theme is a GLOBAL setting, not here — put `theme: monokai` in
# ~/.config/mino/settings.yaml (or set $MINO_THEME). See `mino verify config`.

# Signal result cache. Fetched sections are stored in <home>/.data/cache.duckdb
# and reused until they age past the TTL, so re-running a flight does not re-hit
# the GitHub, Google, and Slack APIs. Set ttl to "0" to disable entirely.
# Bypass per-run with --no-cache (read nothing, write nothing) or --refresh
# (fetch live, then re-warm). Inspect with `mino cache stats`.
# If a fetch fails and a cached copy is under 24h old, mino serves it and marks
# the section "(stale <age>)" rather than showing an error.
cache:
  ttl: 60s
  # How long one item's fetched details (body, checks, reviews, comments) stay
  # fresh, for `mino show` and the deck's details view. Separate from `ttl`
  # because details are fetched per item, not per signal. "0" disables.
  # Falls back to `detail_cache_ttl` in settings.yaml, then 5m.
  detail_ttl: 5m
  # Per-signal overrides beat the global ttl. An explicit value also turns on
  # caching for a signal that does not advertise the `cacheable` capability;
  # "0" turns it off. Signals reading local state (ntr) are never cached.
  # signals:
  #   github: 5m            # slow API, cache harder
  #   gcx: 5m               # gcx omits `cacheable` (view=status reads local
  #                         # sealed-token state); set this to cache incidents

# Audit trail: every flight/query run and each applied config is recorded to an
# embedded DuckDB database (default <home>/audit.duckdb) with timestamps, for
# recall and workflow metrics — not caching. Recall with `mino history`.
audit:
  enabled: true
  # path: /custom/path/audit.duckdb

# `mino backup` creates an AES-256-GCM encrypted tar of the DuckDB databases.
# The key is escrowed in a secret manager: secret_backend "auto" tries Bitwarden
# (bw), then 1Password (op), then the OS keyring. destination "local" writes to
# the current directory; any other value names a plugin-contributed destination
# ("gdrive" comes from the external Drive plugin).
backup:
  secret_backend: auto      # auto | bitwarden | 1password | keyring
  secret_name: mino-backup-key
  destination: local        # local, or a plugin destination such as gdrive
  keep: 0                   # retain newest N backups (0 = unlimited)

# Default role, applied only until a role is activated. A role names the
# flights, queries, and filters that appear in lists and the TUI; with no
# active role, everything is listed. `mino role use <name>` records the active
# role in .data/state.duckdb and never edits this file, so once you have
# activated (or cleared) a role this setting is ignored. Override
# per-invocation with --role, or the MINO_ROLE env var.
role: ""

# TUI hotkeys (global on the deck host). Keys are bubbletea strings; targets are
# an NTR builder, role.next/role.prev, or a flight name (`morning` or
# `flight:morning`). Defaults use Alt so they do not collide with in-list r/x.
keybinds:
  alt+n: ntr.note.new      # open a note builder
  alt+r: ntr.remind.new    # open a reminder builder
  alt+t: ntr.task.new      # open a task builder
  alt+b: ntr.buckets       # open the buckets index
  alt+[: role.prev         # previous role; cycles through "no role" (hooks debounced)
  alt+]: role.next         # next role; cycles through "no role" (hooks debounced)
  # alt+f: morning         # example: jump straight to a flight

# Roles, flights, queries, and filters are each their own file store — see
# examples/roles/*.yaml, examples/flights/*.yaml, examples/queries/*.yaml, and
# examples/filters/*.yaml (each a DuckDB-backed store). Role files may also set
# `contexts:` (tool → name), `hooks:` (enter/exit bash or PowerShell), and
# `status:` (glyph + command chips) applied on activation; see examples/README.md.

# Long-running daemon defaults (`mino serve`). Command flags override these.
daemon:
  interval: 60s     # poll floor for polled (non-websocket) signals
  bell: true        # ring the terminal bell on each notification
  desktop: false    # send OS desktop notifications
  tray: false       # system tray icon on the installed daemon (Linux SNI/AppIndicator, macOS, Windows)
  theme: dark       # tray/notification icon theme: dark or light
  http:             # HTTP trigger API under /api/v1, exposed only while serve runs
    enabled: false  # off unless asked for
    host: 127.0.0.1 # bind address; anything else exposes triggers off-box (containers)
    port: 7717      # unprivileged port for that API
    max_concurrent: 4 # simultaneous flight/query/action runs before 429
    # token: ""     # bearer token; leave unset and mino generates one in .data/http.token (0600)
    identity:       # let a human sign in with a GitHub identity instead of sharing the token
      enabled: false      # off unless asked for; the token above keeps working either way
      provider: github    # the only provider the stock binary serves
      # client_id: ""     # an OAuth App client id with "Enable Device Flow" ticked. Separate from
                          # github.oauth_client_id (that one is the OUTBOUND `mino login github`
                          # credential); falls back to it when unset. Device flow is a public
                          # client, so there is no secret to set here.
      allowed_logins: []  # who may sign in. Empty with enabled: true is a STARTUP ERROR, never
                          # "allow everyone". Comma-separated works too, so
                          # MINO_DAEMON_HTTP_IDENTITY_ALLOWED_LOGINS=alice,bob does what it looks like.
      session_ttl: 12h    # sessions expire and are not renewed; sign in again. Capped at 90d.
      # scopes: ""        # leave empty: resolving a login needs no scope, and mino throws the
                          # GitHub token away as soon as it has the login.
      # Every allowed login gets exactly the power the token has: requests still run as the
      # serve session's role. This is authentication, not authorization.

# Per-signal defaults. A saved query may override any of these via its `params`.
# Which git forge mino authenticates against for onboarding checks, the deck status
# chip and `mino verify auth`. Only "github" ships in the stock binary; other providers
# come from internal plugins and read their settings from plugins.<provider>.
git:
  provider: github

github:
  queries:
    - "is:open is:pr author:@me"
    - "is:open is:pr review-requested:@me"
  max: 30                   # results per query
  # api_url: https://ghe.example.com/api/v3   # GitHub Enterprise REST base
  # Fallback when the gh CLI is absent: `mino login github` (OAuth device flow).
  # oauth_client_id: Iv1.xxxxxxxxxxxx
  # oauth_scopes: "repo read:org"             # scopes for `mino login github` only;
                                              # a GitHub App uses installation permissions

  # Service authentication, for unattended deployments. Either block below outranks
  # the gh CLI, $GITHUB_TOKEN, $GH_TOKEN and the sealed store. Once configured, mino
  # will NOT fall back to your personal credential: a half-configured app is a startup
  # error, because a silent downgrade would run actions and comments under your name.
  #
  # Whether a service identity also satisfies the onboarding check is decided at build
  # time (`make build SERVICE_AUTH=1`), never at runtime. The container image sets it.

  # viewer: acme-bot        # replaces @me in queries; a service identity is not you, so
                            # author:@me otherwise matches nothing and returns empty

  # A machine-user PAT. Also MINO_GITHUB_SERVICE_TOKEN, or the sealed store key
  # "github-service". This is what gives a container realtime GitHub: an App cannot
  # read /notifications.
  # service_token: ghp_xxxxxxxxxxxx

  # A GitHub App installation. There is deliberately no private_key field here — key
  # material must never live in config, which is stored verbatim in .data/config.duckdb.
  # app:
  #   id: "123456"
  #   installation_id: "78901234"   # omit to discover it when there is exactly one
  #   private_key_path: /run/secrets/mino-github-app.pem

# Plugin settings. Every non-stock signal reads its knobs from this section,
# namespaced by plugin: `plugins.<namespace>.<key>`. Stock mino ships GitHub and
# NTR only; the Google and Slack signals live in external/plugins and are
# registered by an overlay binary (see external/plugins/README.md).
# Override any leaf from the environment: MINO_PLUGINS_CALENDAR_MAX=20.
# plugins:
#   google:
#     # Desktop-app OAuth client; fallback for gcloud ADC (`mino login google`).
#     oauth_client_id: xxxx.apps.googleusercontent.com
#     oauth_client_secret: xxxx
#   calendar:
#     calendar_id: primary
#     window: 24h
#     max: 50
#   gmail:
#     query: "is:unread in:inbox"
#     max: 15
#   docs:
#     recent: 10
#   drive:
#     dir: "Inbox"            # the single writable folder (name or id)
#     folders: ["Inbox", "Projects"]
#     recent: 20
#   tasks:
#     list: "My Tasks"        # the single writable list (name or id)
#     lists: ["My Tasks", "Work"]
#     show_completed: false
#     max: 100
#   slack:
#     token_env: SLACK_TOKEN
#     limit: 50
#     oauth_client_id: "123.456"
#     oauth_client_secret: xxxx
#     user_scopes: channels:history,channels:read,groups:history,groups:read
#   argocd:
#     # The ArgoCD UI root. https only — mino refuses to send the API token
#     # over plain http. For a private CA set ca_file rather than downgrading.
#     server_url: https://argocd.example.com
#     ca_file: /etc/ssl/certs/internal-ca.pem
#     # Token order: the sealed `argocd` credential first, then this env var.
#     # Mint one with `argocd account generate-token --account mino` and grant
#     # `p, role:mino, applications, get, */*, allow`.
#     token_env: ARGOCD_AUTH_TOKEN
#     projects: [platform, storefront]
#     selector: env=prod
#     # app_namespace is where the Application resource lives (sent as
#     # appNamespace). namespaces filters spec.destination.namespace, where the
#     # workloads land — the list API cannot filter that, so mino does it
#     # client-side. They are not interchangeable.
#     app_namespace: argocd
#     namespaces: [payments, checkout]
#     only_unhealthy: false
#     group_by: none          # none | project | cluster
#     max: 50
#   gcx:
#     stack: myorg.grafana.net   # fallback when no role `contexts: {gcx: …}` is bound
#     token_env: GCX_TOKEN       # env override for the sealed `gcx` token
#     view: incidents            # default surface (incidents|status)
#     status: active             # incidents filter (active|resolved|all)
#     limit: 20
#     drills: false
#     timeout: 20s
#     allow_write: false         # required before declare-incident / add-activity run
#     default_severity: minor
