# Copy to ~/.munin/config.yaml and edit. Every field is optional; the values
# shown are munin's built-in defaults (except roles/flights, empty by default).

output: terminal            # terminal | json  (override per-run with --output)
timeout: 30s                # per-signal fetch timeout (override with --timeout)
# The UI theme is a GLOBAL setting, not here — put `theme: monokai` in
# ~/.config/munin/settings.yaml (or set $MUNIN_THEME). See `munin verify config`.

# Signal result cache. Fetched sections are stored in <home>/.data/cache.duckdb
# and reused until they age past the TTL, so re-running a flight does not re-hit
# the GitHub, Google, and Slack APIs. Set ttl to "0" to disable entirely.
# Bypass per-run with --no-cache (read nothing, write nothing) or --refresh
# (fetch live, then re-warm). Inspect with `munin cache stats`.
# If a fetch fails and a cached copy is under 24h old, munin serves it and marks
# the section "(stale <age>)" rather than showing an error.
cache:
  ttl: 60s
  # Per-signal overrides beat the global ttl. An explicit value also turns on
  # caching for a signal that does not advertise the `cacheable` capability;
  # "0" turns it off. Signals reading local state (ntr) are never cached.
  # signals:
  #   github: 5m            # slow API, cache harder
  #   calendar: 30s         # time-sensitive

# Audit trail: every flight/query run and each applied config is recorded to an
# embedded DuckDB database (default <home>/audit.duckdb) with timestamps, for
# recall and workflow metrics — not caching. Recall with `munin history`.
audit:
  enabled: true
  # path: /custom/path/audit.duckdb

# `munin backup` creates an AES-256-GCM encrypted tar of the DuckDB databases.
# The key is escrowed in a secret manager: secret_backend "auto" tries Bitwarden
# (bw), then 1Password (op), then the OS keyring. destination "local" writes to
# the current directory; "gdrive" uploads to the app's private Drive folder.
backup:
  secret_backend: auto      # auto | bitwarden | 1password | keyring
  secret_name: munin-backup-key
  destination: local        # local | gdrive
  keep: 0                   # retain newest N backups (0 = unlimited)

# Active role. A role names the flights, queries, and filters that appear in
# lists and the TUI; with no active role, everything is listed. Override
# per-invocation with --role, or the MUNIN_ROLE env var.
role: ""

# TUI hotkeys (global on the deck host). Keys are bubbletea strings; targets are
# an NTR create form, role.next/role.prev, or a flight name (`morning` or
# `flight:morning`). Defaults use Alt so they do not collide with in-list n/r/t.
keybinds:
  alt+n: ntr.note.new      # open new-note form
  alt+r: ntr.remind.new    # open new-reminder form
  alt+t: ntr.task.new      # open new-task form
  alt+[: role.prev         # previous role; cycles through "no role" (hooks debounced)
  alt+]: role.next         # next role; cycles through "no role" (hooks debounced)
  # alt+f: morning         # example: jump straight to a flight

# Roles, flights, queries, and filters are each their own file store — see
# examples/roles/*.yaml, examples/flights/*.yaml, examples/queries/*.yaml, and
# examples/filters/*.yaml (each a DuckDB-backed store). Role files may also set
# `contexts:` (tool → name), `hooks:` (enter/exit bash or PowerShell), and
# `status:` (glyph + command chips) applied on activation; see examples/README.md.

# Long-running daemon defaults (`munin serve`). Command flags override these.
daemon:
  interval: 60s     # poll floor for polled (non-websocket) signals
  bell: true        # ring the terminal bell on each notification
  desktop: false    # send OS desktop notifications
  tray: false       # system tray icon on the installed daemon (Linux SNI/AppIndicator, macOS, Windows)
  theme: dark       # tray/notification icon theme: dark or light

# Per-signal defaults. A saved query may override any of these via its `params`.
github:
  queries:
    - "is:open is:pr author:@me"
    - "is:open is:pr review-requested:@me"
  max: 30                   # results per query
  # api_url: https://ghe.example.com/api/v3   # GitHub Enterprise REST base
  # Fallback when the gh CLI is absent: `munin login github` (OAuth device flow).
  # oauth_client_id: Iv1.xxxxxxxxxxxx
  # oauth_scopes: "repo read:org"             # scopes requested by `munin login github`

# OAuth fallbacks for when the signal CLI is unavailable. Each needs an app's
# client credentials; run `munin login <service>` to authorize and cache a token.
google:
  # Desktop-app OAuth client; fallback for gcloud ADC (`munin login google`).
  # oauth_client_id: xxxx.apps.googleusercontent.com
  # oauth_client_secret: xxxx

calendar:
  calendar_id: primary
  window: 24h
  max: 50                   # events to list

gmail:
  query: "is:unread in:inbox"
  max: 15

docs:
  recent: 10

# Google Drive — read+write. Reads list `folders` (or recent files when empty);
# `munin drive add` creates a file ONLY in `dir`. Every other directory is
# read-only, enforced by munin regardless of the OAuth grant.
drive:
  dir: "Inbox"              # the single writable folder (name or id)
  # folders: ["Inbox", "Projects"]   # restrict reads (empty = recent files)
  # recent: 20

# Google Tasks — munin's one read+write signal. Reads cover `lists` (or all
# lists when empty); `munin tasks add` creates tasks ONLY in `list`. Every other
# list is read-only, enforced by munin regardless of the OAuth grant.
tasks:
  list: "My Tasks"          # the single writable list (name or id)
  # lists: ["My Tasks", "Work"]   # restrict reads (empty = all lists)
  # show_completed: false
  max: 100                  # tasks to list per list

slack:
  token_env: SLACK_TOKEN
  limit: 50                 # messages to fetch per channel
  # Fallback when no token env var is set: `munin login slack` (browser OAuth).
  # oauth_client_id: "123.456"
  # oauth_client_secret: xxxx
  # user_scopes: channels:history,channels:read,groups:history,groups:read
