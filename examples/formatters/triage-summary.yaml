# A triage digest built from the flat `.Items` view: one count, repo buckets,
# then the freshest handful. Add `formatter: triage-summary` to the triage
# flight and a bare `munin fly triage` prints the digest instead of panels:
#   munin fly triage --formatter triage-summary
#   munin formatter render triage-summary triage
name: triage-summary
type: formatter
title: Triage Summary
# `byMeta` buckets items by a meta key (sorted by key, missing key = ""), and
# `sortByTime | limit 5` takes the five newest. Every template function takes
# the piped value last, so these read left to right.
template: |
  # Triage · {{ now | date "Mon 02 Jan 15:04" }}
  {{ .Count }} item{{ if ne .Count 1 }}s{{ end }} across {{ len .Sections }} section{{ if ne (len .Sections) 1 }}s{{ end }}.
  {{- range byMeta "repo" .Items }}
  - {{ .Key | default "(no repo)" }} — {{ len .Items }}
  {{- end }}

  Most recent:
  {{- range .Items | sortByTime | limit 5 }}
  - {{ .Title | truncate 70 }} · {{ rel .Timestamp | default "just now" }}
  {{- else }}
  - nothing to triage
  {{- end }}
  {{- if .Errors }}

  Sections that failed:
  {{- range .Errors }}
  - {{ . }}
  {{- end }}
  {{- end }}
