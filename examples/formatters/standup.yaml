# A formatter is a Go text/template that turns a run's results into text. It
# replaces the panels on stdout, so it pipes cleanly:
#   munin fly morning --formatter standup
#   munin formatter render standup morning --copy
name: standup
type: formatter
# Optional display label for `munin formatter`, completion, and the deck.
title: Daily Standup
# `.Queries` groups the results by the saved query that produced them, so each
# query becomes one heading. Missing map keys render empty rather than failing
# the run, so `.Meta.author` is safe on signals that have no author.
template: |
  ## Standup {{ now | date "2006-01-02" }}
  {{ range .Queries }}
  ### {{ .Title | default .Query }} ({{ .Count }})
  {{ range .Items }}- [{{ .Title }}]({{ .URL }}){{ with .Meta.author }} — @{{ . }}{{ end }}
  {{ end }}{{ else }}
  Nothing on the board today.
  {{ end }}
  _{{ .Count }} items · {{ .Name }}{{ with .Role }} · role {{ . }}{{ end }}_
