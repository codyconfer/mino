name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            tags: ""
          - name: daemon
            tags: daemon
          - name: nodaemon
            tags: nodaemon
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make build
        run: make build TAGS="${{ matrix.tags }}"
      - name: make vet
        run: make vet TAGS="${{ matrix.tags }}"
      - name: make test
        run: make test TAGS="${{ matrix.tags }}"

  # Race detector. Its own job, not a flag on `build`: race builds are slow and
  # CGO-heavy here (duckdb), and the fast signal is worth keeping. Default tags
  # only — one race configuration is enough, no need to multiply the tag matrix.
  race:
    name: race
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make test-race
        run: make test-race

  # Randomized test order, to catch tests that depend on execution order.
  shuffle:
    name: shuffle
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make test-shuffle
        run: make test-shuffle

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make ci
        run: make ci
